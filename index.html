<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080c"><meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Coin Rouge">
<meta name="format-detection" content="telephone=no"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-180.png">
<style>html,body{margin:0;background:#07080c;overscroll-behavior:none}body{font:14px system-ui;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea{-webkit-user-select:text;user-select:text}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Coin Rouge</title>

<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: premium fight-night game UI. Dark arena base with red/gold stage light, glass panels, metallic gold for progression, tier-framed collectible boxer cards, floating blurred dock. Red corner = ton club, blue = adversaire. */
:root{
  color-scheme:dark;
  --bg:#07080c; --bg2:#0d1018; --s1:#121621; --s2:#181d2b; --s3:#232a3b; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --ink:#f5f6fa; --muted:#8c95a8; --red:#ff3b50; --red2:#c8102e; --blue:#4f80ff; --gold:#f5c451; --gold2:#b8860b; --green:#38d98a; --warn:#ff9f43;
  --gold-g:linear-gradient(135deg,#fff1b8 0%,#f5c451 30%,#c8901a 62%,#ffe08a 100%);
  --red-g:linear-gradient(180deg,#ff5a6c 0%,#e0213a 55%,#b3122a 100%);
  --glass:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
  --shadow:0 14px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);
  --f-disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;min-height:100vh;
  background:
    radial-gradient(ellipse 80% 45% at 15% -5%,rgba(255,59,80,.22),transparent 60%),
    radial-gradient(ellipse 70% 40% at 95% 0%,rgba(245,196,81,.13),transparent 60%),
    radial-gradient(ellipse 120% 70% at 50% 110%,rgba(79,128,255,.10),transparent 60%),
    linear-gradient(180deg,var(--bg2),var(--bg) 60%) fixed;
  background-color:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0b0d14}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[role=button]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px;color:var(--muted)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;padding-block:10px;
  background:linear-gradient(180deg,rgba(11,13,20,.96),rgba(11,13,20,.86));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--red) 30%,var(--gold) 70%,transparent);opacity:.6}
.hrow{display:flex;align-items:center;gap:10px;max-width:860px;margin:0 auto}
.mark{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:18px;color:#fff;
  background:var(--red-g);box-shadow:0 0 0 1.5px #f5c451,0 6px 18px rgba(255,59,80,.45),inset 0 1px 0 rgba(255,255,255,.35);transform:rotate(-6deg);text-shadow:0 1px 0 rgba(0,0,0,.3)}
.club{min-width:0;margin-right:auto}
.club b{display:block;font-family:var(--f-disp);font-weight:900;font-size:22px;line-height:1;text-transform:uppercase;letter-spacing:.04em}
.club span{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.cash{display:flex;align-items:center;gap:7px;background:rgba(245,196,81,.08);border:1px solid rgba(245,196,81,.25);border-radius:12px;padding:5px 10px}
.cash::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--gold-g);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 10px rgba(245,196,81,.4);flex:none}
.cash small{display:none}
.cash b{font-family:var(--f-mono);font-weight:500;font-size:14px;color:#ffe9a8}
.neg{color:var(--red)!important}
.next{border:0;border-radius:12px;background:linear-gradient(180deg,#fff,#d9dde6);color:#0b0d14;font-weight:800;padding:9px 12px;font-size:13.5px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 -2px 0 rgba(0,0,0,.12)}
.next.fight{background:var(--red-g);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.15),0 6px 20px rgba(255,59,80,.5);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,59,80,.18),0 6px 20px rgba(255,59,80,.5)}}
.gear{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:11px;padding:7px;color:var(--muted);flex:none}
.gear svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}

/* floating dock */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px));pointer-events:none}
nav.tabs .in{pointer-events:auto;display:grid;grid-template-columns:repeat(6,1fr);max-width:620px;margin:0 auto;padding:6px;border-radius:22px;
  background:rgba(16,19,28,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);box-shadow:0 18px 40px rgba(0,0,0,.6)}
nav.tabs button{background:none;border:0;border-radius:16px;padding:7px 2px 6px;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);position:relative;letter-spacing:.02em}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:#fff;background:linear-gradient(180deg,rgba(255,59,80,.28),rgba(255,59,80,.08));box-shadow:inset 0 0 0 1px rgba(255,59,80,.35)}
nav.tabs button[aria-current="true"] svg{stroke:#ff8a98;filter:drop-shadow(0 0 6px rgba(255,59,80,.7))}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--gold-g);color:#2a1d00;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 10px rgba(245,196,81,.6)}

main{max-width:860px;margin:0 auto;padding-block:18px calc(110px + env(safe-area-inset-bottom,0px))}
h2{font-family:var(--f-disp);font-weight:900;font-size:34px;line-height:.95;text-transform:uppercase;margin:0 0 6px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:6px;height:26px;border-radius:3px;background:linear-gradient(180deg,var(--red),var(--gold));box-shadow:0 0 12px rgba(255,59,80,.5);flex:none}
.lede{color:var(--muted);margin:0 0 14px;max-width:60ch;font-size:14px}
.stack{display:grid;gap:12px}
@media (min-width:720px){.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
.panel{background:var(--glass),var(--s1);border:1px solid var(--line);border-radius:20px;padding:15px;min-width:0;box-shadow:var(--shadow)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--line);white-space:nowrap;letter-spacing:.02em}
.chip.gold{background:var(--gold-g);color:#2a1d00;border-color:transparent;box-shadow:0 0 12px rgba(245,196,81,.3)}
.chip.red{background:var(--red-g);color:#fff;border-color:transparent}
.chip.blue{background:linear-gradient(180deg,#6d97ff,#3a63e0);color:#fff;border-color:transparent}
.chip.good{background:rgba(56,217,138,.12);color:var(--green);border-color:rgba(56,217,138,.3)}
.chip.bad{background:rgba(255,59,80,.12);color:#ff7b8b;border-color:rgba(255,59,80,.3)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.btn{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--line2);border-radius:13px;padding:10px 14px;font-weight:800;font-size:14px;letter-spacing:.01em;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.btn.pri{background:var(--red-g);border-color:rgba(255,255,255,.12);color:#fff;box-shadow:0 8px 22px rgba(255,59,80,.35),inset 0 1px 0 rgba(255,255,255,.3);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.gold{background:var(--gold-g);border-color:rgba(255,255,255,.25);color:#2a1d00;box-shadow:0 8px 22px rgba(245,196,81,.28),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.ghost{background:none;box-shadow:none}
.btn.danger{color:#ff7b8b}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none;filter:grayscale(.4)}
.big{width:100%;padding:15px;font-size:16px;text-transform:uppercase;letter-spacing:.05em;font-family:var(--f-disp);font-weight:900;font-size:19px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.35);border:1px solid var(--line);padding:4px;border-radius:14px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;background:none;border:0;border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 -2px 0 var(--red)}
.seg button:disabled{opacity:.4}
.seg button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:5px;vertical-align:middle;box-shadow:0 0 6px var(--green)}
.trk{height:6px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.trk i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#c9cfdb,#fff)}
.trk.gold i{background:linear-gradient(90deg,#b8860b,#f5c451,#fff1b8);box-shadow:0 0 10px rgba(245,196,81,.55)}
.trk.green i{background:linear-gradient(90deg,#1f9e60,#38d98a)} .trk.warn i{background:linear-gradient(90deg,#d9721b,#ff9f43)}
.trk.red i{background:linear-gradient(90deg,#b3122a,#ff3b50)} .trk.blue i{background:linear-gradient(90deg,#2d55d6,#6d97ff)}
@media (prefers-reduced-motion:no-preference){.trk i{transition:width .45s ease}}

/* tiers */
.t-b{--tc:#c98a5a;--tg:linear-gradient(135deg,#f0c49a,#a8673b 45%,#e3a877 70%,#7a4520)}
.t-s{--tc:#c9d2e0;--tg:linear-gradient(135deg,#ffffff,#9aa6ba 45%,#e8edf5 70%,#6d778a)}
.t-g{--tc:#f5c451;--tg:var(--gold-g)}
.t-e{--tc:#b48cff;--tg:linear-gradient(135deg,#e5d4ff,#8a5cf5 40%,#f5c451 75%,#6a3ce0)}
.t-l{--tc:#ff6a7c;--tg:linear-gradient(135deg,#fff1b8,#ff3b50 35%,#f5c451 65%,#b3122a)}
.tier-tag{font-family:var(--f-disp);font-weight:900;font-size:11px;letter-spacing:.16em;text-transform:uppercase;background:var(--tg);-webkit-background-clip:text;background-clip:text;color:transparent}

/* avatars */
.av{flex:none;width:64px;height:64px;border-radius:16px;overflow:hidden;position:relative;
  background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.18),transparent 60%),linear-gradient(160deg,#2a3247,#141927);border:1px solid var(--line2)}
.av svg{display:block;width:100%;height:100%}
[class*="t-"] .av,.av[class*="t-"]{border:0;box-shadow:0 0 0 2px var(--tc),0 6px 18px rgba(0,0,0,.4)}
.av.lg{width:118px;height:118px;border-radius:24px}
.av.md{width:82px;height:82px;border-radius:18px}
.av.sm{width:44px;height:44px;border-radius:12px}

/* collectible boxer card */
.bx{display:block;width:100%;text-align:left;border-radius:22px;padding:14px;position:relative;overflow:hidden;cursor:pointer;
  background:linear-gradient(var(--s1),var(--s1)) padding-box,var(--tg,linear-gradient(#333,#333)) border-box;border:1.5px solid transparent;box-shadow:var(--shadow)}
.bx::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 0% 0%,color-mix(in srgb,var(--tc,#888) 22%,transparent),transparent 70%),var(--glass);pointer-events:none}
.bx::after{content:"";position:absolute;top:-60%;left:-30%;width:40%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);transform:rotate(20deg);pointer-events:none}
@media (prefers-reduced-motion:no-preference){.bx::after{animation:sheen 6s ease-in-out infinite}@keyframes sheen{0%,70%{left:-40%}100%{left:130%}}}
.bx>*{position:relative}
.bx-h{display:flex;gap:12px;align-items:center}
.bx-id{min-width:0;flex:1}
.nm{font-family:var(--f-disp);font-weight:800;font-size:23px;line-height:1;text-transform:uppercase;overflow-wrap:anywhere;letter-spacing:.01em}
.sub{font-size:12.5px;color:var(--muted);margin:3px 0 6px}
.ovr{flex:none;text-align:center;width:58px}
.ovr b{display:block;font-family:var(--f-disp);font-weight:900;font-size:42px;line-height:.9;background:var(--tg,var(--gold-g));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.ovr small{font-size:9px;letter-spacing:.18em;color:var(--muted);font-weight:800}
.xpr{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin:13px 0 11px;font-size:12px}
.xpr .lv{font-family:var(--f-disp);font-weight:900;font-size:16px;letter-spacing:.04em;background:var(--gold-g);-webkit-background-clip:text;background-clip:text;color:transparent}
.xpr .trk{height:8px}
.s5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.s5 div{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:6px 0 5px;text-align:center}
.s5 small{display:block;font-size:9px;letter-spacing:.14em;color:var(--muted);font-weight:800}
.s5 b{font-family:var(--f-disp);font-weight:800;font-size:21px;line-height:1.05}
.hi{color:var(--gold);text-shadow:0 0 10px rgba(245,196,81,.4)} .mid{color:var(--green)}
.cond{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:11px}
.cond small{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600}
.plan{margin-top:12px}
.msmini{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:12px;color:var(--muted)}
.msmini .trk{flex:1;height:5px}

/* alerts */
.todo{display:grid;gap:8px;margin-bottom:14px}
.al{display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,rgba(245,196,81,.10),rgba(245,196,81,.02)),var(--s1);border:1px solid rgba(245,196,81,.22);border-radius:16px;padding:10px 12px}
.al.bad{background:linear-gradient(90deg,rgba(255,59,80,.12),rgba(255,59,80,.02)),var(--s1);border-color:rgba(255,59,80,.28)}
.al p{margin:0;flex:1;font-size:13.5px;min-width:0}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;overflow-y:auto;overscroll-behavior:contain;
  background:radial-gradient(ellipse 90% 40% at 50% -5%,rgba(255,59,80,.18),transparent 60%),var(--bg);
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
.sheet .in{max-width:740px;margin:0 auto;display:grid;gap:12px}
.back{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;color:var(--ink);font-weight:800;padding:8px 13px;justify-self:start}
.hero{display:flex;gap:16px;align-items:center;padding:16px;border-radius:24px;position:relative;overflow:hidden;
  background:linear-gradient(var(--s1),var(--s1)) padding-box,var(--tg) border-box;border:1.5px solid transparent;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 90% at 10% 50%,color-mix(in srgb,var(--tc) 28%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero .nm{font-size:32px}
.nick{font-style:italic;font-size:14px;color:#ffe08a}
.sr{display:grid;grid-template-columns:78px 1fr 30px 70px;gap:8px;align-items:center;padding:7px 0;font-size:13.5px;font-weight:600}
.sr .trk{height:10px}
.sr .cap{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--gold);box-shadow:0 0 6px var(--gold)}
.sr b{font-family:var(--f-disp);font-weight:800;font-size:19px;text-align:right}
.trait{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.trait b{display:block;font-size:14px} .trait span{font-size:12.5px;color:var(--muted)}
.trait.neg b{color:#ff7b8b} .trait.pos b{color:var(--green)}
.tgrid{display:grid;gap:7px}
.pick{border:1px dashed var(--gold);text-align:left;width:100%;background:rgba(245,196,81,.06)}
.ms{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ms:last-child{border:0}
.ms .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:16px;background:rgba(245,196,81,.1);border:1px solid rgba(245,196,81,.3);color:var(--gold)}
.ms b{font-size:14px}.ms .trk{height:6px;margin-top:6px}
.ms .rw{text-align:right;font-family:var(--f-mono);font-size:12px;color:#ffe08a;white-space:nowrap}
.trial{border:1.5px solid transparent;background:linear-gradient(var(--s1),var(--s1)) padding-box,var(--gold-g) border-box}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:7px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.me td{background:linear-gradient(90deg,rgba(255,59,80,.16),rgba(255,59,80,.03))}
td.rk{font-family:var(--f-disp);font-weight:900;font-size:21px;width:34px;color:#cfd5e2}
.opp{display:flex;gap:9px;align-items:center;min-width:150px}

/* bouts & gyms */
.bout{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.bout .side{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;min-width:0}
.bout .nm{font-size:18px}
.vs{font-family:var(--f-disp);font-weight:900;font-size:26px;background:var(--gold-g);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}
.gym{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--glass),var(--s1);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.gym[aria-pressed="true"]{border-color:rgba(245,196,81,.6);box-shadow:0 0 0 1px rgba(245,196,81,.3),var(--shadow)}
.gym:disabled{opacity:.42}
.tier{flex:none;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:21px}
.tier.done{background:var(--gold-g);color:#2a1d00;border:0;box-shadow:0 0 14px rgba(245,196,81,.45)}
.dots{display:flex;gap:4px;margin-top:5px}.dots i{width:18px;height:5px;border-radius:3px;background:rgba(255,255,255,.1)}.dots i.on{background:var(--gold-g);box-shadow:0 0 6px rgba(245,196,81,.5)}

/* fight */

const selH=(act,items,cur,key)=>`<select class="selx" data-sa="${act}" data-sk="${key||'k'}">${items.map(([k,n])=>`<option value="${k}" ${k===cur?'selected':''}>${n}</option>`).join('')}</select>`;

// Où arrivent les avis des testeurs (laisser vide = l'ami choisit à qui l'envoyer)
const FB_TO={sms:'',email:'',nom:'le créateur du jeu'};
/* ---- avis des testeurs (partage par Messages, WhatsApp, etc.) ---- */
const FBK='coin-rouge-avis';let FB={n:0,like:'',fix:'',bug:'',nm:''};

function fbText(){const st=typeof S!=='undefined'&&S?(()=>{const m=S.boxers.filter(b=>b.mine);return`Partie : ${S.club||''} · an ${Math.floor((S.t-1)/52)+1}, sem. ${(S.t-1)%52+1} · ${m.length} boxeurs · ${S.stats?S.stats.wins:0} victoires · ${Math.round(S.money).toLocaleString('fr-CA')} $`})():'Pas encore de partie';
  return`🥊 AVIS COIN ROUGE (v${GAME_V})${FB.nm?' — de '+FB.nm:''}\nNote : ${FB.n?'⭐'.repeat(FB.n)+' ('+FB.n+'/5)':'—'}\n\n👍 J’aime :\n${FB.like||'—'}\n\n🔧 À améliorer :\n${FB.fix||'—'}\n\n🐞 Bugs :\n${FB.bug||'—'}\n\n${st}\nÉcran : ${innerWidth}×${innerHeight}`}
function fbRender(msg){const el=document.getElementById('fb'),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  el.innerHTML=`<div class="mcard nt fbf" role="dialog" aria-label="Donner mon avis"><span class="lab">Version test ${GAME_V}</span><h3>Ton avis</h3><div class="mbody">

  <label for="fb-like">👍 Ce que tu aimes</label><textarea id="fb-like" data-fbk="like" placeholder="Les combats en 3D, les ceintures…">${e(FB.like)}</textarea>

function openFB(){fbLoad();fbRender()}
async function fbSend(){const t=fbText();
  if(FB_TO.sms){location.href='sms:'+FB_TO.sms+(/iPhone|iPad|Mac/.test(navigator.userAgent)?'&':'?')+'body='+encodeURIComponent(t);return}

  try{if(navigator.share){await navigator.share({title:'Mon avis sur Coin Rouge',text:t});fbRender('Merci ! Ton avis est envoyé 🙌');return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(t);fbRender('Message copié ! Colle-le dans Messages ou WhatsApp pour l’envoyer.');return}catch(e){}

function render(){

  else if(sid.startsWith('op:')){const b=getB(sid.slice(3));if(b)sv=vScout(b)}
  else if(sid.startsWith('camp:')){const f=S.fights.find(x=>x.id===sid.slice(5));if(f)sv=vCamp(f)}
  else if(sid==='galanew')sv=vGalaNew();
  else if(sid==='todo')sv=vTodo();
  else if(sid==='myclub')sv=vMyClub();
  else if(sid.startsWith('gym:')){const g=gymOf(sid.slice(4));if(g)sv=vGym(g)}
  else if(sid.startsWith('am:')){const b=(S.am||[]).find(x=>x.id===sid.slice(3));if(b)sv=vAmSheet(b)}
  else if(sid.startsWith('promo:')){const p=(S.promos||[]).find(x=>x.id===sid.slice(6));if(p)sv=vPromo(p)}
  else if(sid.startsWith('gala:')){const g=(S.galas||[]).find(x=>x.id===sid.slice(5));if(g)sv=vGala(g)}
  else if(sid){const b=getB(sid);if(b&&b.mine)sv=vSheet(b)}

  renderEvent();renderNeg();
}

    ${A.prep!=null&&!F.ex&&!F.trial&&!F.tour?`<div class="rstat"><span>Préparation ${A.prep} %${A.gpb?' · plan de match efficace':''}</span><span>${A.camp&&A.camp!=='std'?CAMPS[A.camp].n:''}</span></div>`:''}

  if(F.stage==='between'){const s=F.rs[F.rs.length-1]||[0,0],j=F.cards[0],st=F.rst[F.rst.length-1]||{},sel=F.cs||autoCorner(A),c2=S.staff.coach&&S.staff.coach.stars>=2;

    <div><div class="lab" style="margin-bottom:6px">Dans le coin (1 minute)</div><div class="cgrid">${Object.entries(CORNER).map(([k,c])=>{const dis=(k==='coupure'&&!A.cut)||(k==='plan'&&!c2);return`<button class="cbtn" data-a="fcs" data-k="${k}" aria-pressed="${sel===k}" ${dis?'disabled':''}><b>${c.n}</b><span>${k==='coupure'?(A.cut?`Coupure ${A.cut}/3`:'Aucune coupure'):k==='plan'&&!c2?'Entraîneur 2★ requis':c.d}</span></button>`}).join('')}</div></div>
    ${coach}<div><div class="lab" style="margin-bottom:6px">Plan pour le ${ord(F.r+1)} round</div>${segStrat(F)}</div>

/* ================= ÉVÉNEMENTS ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,id=t.dataset.id,k=t.dataset.k;
  if(a.startsWith('m_')){menuAct(a,t);return}
  if(!S)return;
  if(!['release','new','fire','cancelf','negno','cdiv','retire','sellpromo'].includes(a))ui.confirm=null;
  const b=id?getB(id):null;
  switch(a){
    case'tab':ui.tab=k;ui.sheet=null;window.scrollTo(0,0);break;
    case'esub':ui.esub=k;break;
    case'csub':ui.csub=k;break;
    case'next':nextWeek();return;
    case'open':ui.backSheet=ui.sheet==='todo'||ui.sheet==='myclub'||(ui.sheet||'').startsWith('promo:')||(ui.sheet||'').startsWith('gym:')?ui.sheet:null;ui.stab=k||'apercu';ui.sheet=id;document.getElementById('sheet').scrollTop=0;break;
    case'close':if(ui.backSheet&&ui.sheet&&ui.sheet!==ui.backSheet){ui.sheet=ui.backSheet;ui.backSheet=null}else{ui.sheet=null;ui.backSheet=null}break;
    case'plan':if(k!=='sparring'||S.staff.spar.length)b.plan=k;break;
    case'spend':spend(b,k);break;
    case'auto':autoSpend(b);break;
    case'trait':if(b.trOpt&&b.trOpt.includes(k)){b.traits.push(k);b.trOpt=null;log(`${b.name} apprend « ${TRAITS[k].n} ».`,'good')}break;
    case'renew':renew(id);break;
    case'raiseok':b.salary=b.raiseAsk;b.raiseAsk=0;b.loy=cl(b.loy+25,0,100);log(`Augmentation accordée à ${b.name} (${$(b.salary)}/sem.).`);break;
    case'raiseno':b.raiseAsk=0;b.raiseCd=S.t+8;b.loy=cl(b.loy-10,0,100);log(`Tu refuses l’augmentation de ${b.name}. Il n’est pas content.`,'bad');break;

async function packSave(s){const j=JSON.stringify(s);
  try{if(window.CompressionStream){const st=new Blob([j]).stream().pipeThrough(new CompressionStream('gzip'));const u=new Uint8Array(await new Response(st).arrayBuffer());let bin='';for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return'CRZ1:'+btoa(bin)}}catch(e){}
  return'CRJ1:'+btoa(unescape(encodeURIComponent(j)))}
async function unpackSave(code){code=(code||'').replace(/\s+/g,'');
  if(code.startsWith('CRZ1:')){const bin=atob(code.slice(5)),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const st=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(st).text())}
  if(code.startsWith('CRJ1:'))return JSON.parse(decodeURIComponent(escape(atob(code.slice(5)))));throw new Error('format')}

function aiNational(){
  for(const b of S.boxers){if(!b.nchamp||b.mine||b.booked||b.inj||b.retired||S.t-b.lastFight<8||R()>.06)continue;
    const c=natList(b.nat,b.div).filter(x=>x!==b&&!x.mine&&!x.booked&&!x.inj&&!x.nchamp).slice(0,3);if(!c.length)continue;
    quickFight(b,pick(c),false,true);
    const now=S.boxers.find(x=>x.nchamp&&x.nat===b.nat&&x.div===b.div);if(now&&now!==b&&b.nat===S.home)log(`${flag(b.nat)} Nouveau champion national ${divN(b.div)} : ${now.name} bat ${b.name}.`)}
}
function offersWeek(){
  S.offers=(S.offers||[]).filter(o=>{const a=getB(o.a),b=getB(o.b);return o.exp>=S.t&&a&&a.mine&&!a.booked&&b&&!b.booked});
  for(const me of mine()){
    if(me.booked||me.inj||S.offers.some(o=>o.a===me.id)||R()>.2+me.fame/350)continue;
    const wl=rankList(me.div),mi=wl.indexOf(me);
    const pool=(R()<.5?natList(me.nat,me.div):wl.slice(Math.max(0,mi-5),mi+6)).filter(o=>!o.mine&&!o.booked&&!o.inj&&!o.champ&&!o.nchamp&&o!==me);
    if(!pool.length)continue;
    const op=pick(pool),short=R()<.35,p=Math.round(purse(me,op,false)*(short?1.35:1)*(.9+R()*.35)/100)*100;
    S.offers.push({id:'o'+(S.uid++),a:me.id,b:op.id,purse:p,week:S.t+(short?2:4),exp:S.t+2,short,promo:(prOf(op)||{n:pick(PROMOS)}).n});
    log(`Offre de combat pour ${me.name} contre ${flag(op.nat)} ${op.name} : ${$(myShare(p))} pour le club.`);
  }
}

async function doImport(){
  const ta=document.getElementById('imp-code');ui.imp=ta?ta.value:ui.imp;let s;
  try{s=await unpackSave(ui.imp);if(!s||s.v!==2||!Array.isArray(s.boxers))throw 0}catch(e){ui.impErr='Ce code ne fonctionne pas. Vérifie qu’il est complet : il commence par CRZ1: ou CRJ1:.';renderMenu();return}
  s.slot=ui.impSlot||1;fixup(s);ui.imp='';ui.menu=null;enterGame(s);toast('Sauvegarde importée !');

function menuAct(a,t){
  const k=t.dataset.k;if(a!=='m_del'&&a!=='m_slot')ui.mconf=null;
  switch(a){
    case'm_home':ui.menu='home';break;
    case'm_cont':{const n=lastSlot(),s=n&&loadSlot(n);if(s){s.slot=n;ui.menu=null;enterGame(s);return}break}
    case'm_load':ui.menu='load';break;
    case'm_ld':{const s=loadSlot(+k);if(s){s.slot=+k;ui.menu=null;enterGame(s);return}break}
    case'm_del':if(ui.mconf==='del'+k){try{localStorage.removeItem(SK(k));localStorage.removeItem(MK(k))}catch(e){}ui.mconf=null}else ui.mconf='del'+k;break;
    case'm_new':{const e=[1,2,3].find(n=>!slotMeta(n));if(e){ui.ng=newNG(e);ui.menu='ng1'}else ui.menu='slot';break}
    case'm_slot':{const n=+k;if(slotMeta(n)&&ui.mconf!=='ow'+n){ui.mconf='ow'+n;break}ui.mconf=null;ui.ng=newNG(n);ui.menu='ng1';break}
    case'm_nat':if(k)ui.ng.home=k;break;
    case'm_ngc':{const g=ui.ng;g.club=(g.club||'').trim();g.mgr=(g.mgr||'').trim();ui.menu='ngc';document.getElementById('menu').scrollTop=0;break}
    case'm_ngd':ui.menu='ngd';document.getElementById('menu').scrollTop=0;break;
    case'm_ngd2':ui.menu='ngd';break;
    case'm_rclub':ui.ng.club=pick(CLUB_A)+' '+pick(CLUB_B);break;
    case'm_rmgr':ui.ng.mgr=natName(ui.ng.home);break;
    case'm_flt':ui.ng.flt=k;break;
    case'm_info':ui.ng.info=+k;break;
    case'm_infox':ui.ng.info=null;break;
    case'm_pickx':{const i=+k,p=ui.ng.picks;if(p.includes(i))ui.ng.picks=p.filter(x=>x!==i);else{if(p.length>=2)p.shift();p.push(i)}ui.ng.info=null;break}
    case'm_diff':ui.ng.diff=k;break;
    case'm_ng2':{const g=ui.ng;g.club=(g.club||'').trim()||'Coin Rouge';g.mgr=(g.mgr||'').trim()||'Gérant';worldGen(g);genPool();ui.menu='ng2';document.getElementById('menu').scrollTop=0;break}
    case'm_pick':{const i=+k,p=ui.ng.picks;if(p.includes(i))ui.ng.picks=p.filter(x=>x!==i);else{if(p.length>=2)p.shift();p.push(i)}break}
    case'm_rr':if(ui.ng.rr>0){ui.ng.rr--;genPool()}break;
    case'm_back1':case'm_ng1':ui.menu='ng1';break;
    case'm_go':ui.menu=null;finishNew();return;
    case'm_imp':ui.menu='imp';ui.impErr='';ui.impSlot=ui.impSlot||([1,2,3].find(n=>!slotMeta(n))||1);break;
    case'm_impslot':ui.impSlot=+k;break;
    case'm_impgo':doImport();return;
    case'm_mine':loadMine();return;
    case'm_max':{maxGame(ui.impSlot||1);const s=S;ui.menu=null;enterGame(s);toast('Partie maximale chargée !');return}
    case'm_sand':{sandboxGame(ui.impSlot||1);const s=S;ui.menu=null;enterGame(s);toast('Partie de test chargée !');return}
  }
  renderMenu();
}

  <div class="panel"><span class="lab">Diffusion</span><div style="margin-top:8px">${segH(pf+'tv',GTV.map(t=>[t.id,t.n]),tv)}</div>
    <p class="small" style="margin:6px 0 0">${tv==='none'?'Aucun revenu télé.':tv==='loc'?'Petits droits télé, dès que la carte est un peu connue.':tv==='str'?'Une plateforme paie des droits fixes si la carte a 70+ de popularité.':tv==='big'?'Gros chèque d’une grande chaîne, seulement pour une carte de 110+ de popularité.':'Tu vends le combat principal toi-même (25 000 $ de production). Payant seulement si le combat principal est très populaire (90+).'}</p>
    ${tv==='ppv'?`<div style="margin-top:8px"><span class="small">Prix du PPV</span>${segH(pf+'ppvp',PPVP.map(p=>[p,p+' $']),g.ppvp||60)}</div>`:''}</div>
  <div class="panel"><span class="lab">Extras</span>${Object.entries(GX).map(([k,x])=>`<div class="perk"><div><b>${x.n} · ${$(x.c)}</b><div class="small">${x.d}</div></div><button class="sw" data-a="${pf}x" data-k="${k}" aria-pressed="${!!X[k]}" aria-label="${x.n}"><i></i></button></div>`).join('')}</div>`}

    <div class="panel"><span class="lab">Arène</span><div class="list" style="margin-top:8px">${arenaList().map(a=>{const lock=S.mgr.lvl<a.lvl;return`<button class="opt" data-a="gnar" data-k="${a.id}" aria-pressed="${n.arena===a.id}" ${lock?'disabled':''}><b>${a.n}</b><span>${a.cap.toLocaleString('fr-CA')} places · location ${$(a.rent)}${lock?` · gérant niveau ${a.lvl} requis`:''}</span></button>`}).join('')}</div></div>

function vGala(g){

      <div class="row" style="justify-content:space-between;margin-top:10px"><span class="small">Spectateurs estimés</span><b>${e.att.toLocaleString('fr-CA')} / ${e.cap.toLocaleString('fr-CA')}</b></div><div class="trk gold" style="height:8px;margin-top:4px"><i style="width:${pct(e.att/e.cap*100)}%"></i></div>
      <p class="small" style="margin:6px 0 0">${e.city.nat?flag(e.city.nat)+' '+e.city.n+' · ':''}${e.loc?`${e.loc} boxeur${e.loc>1?'s':''} du pays sur la carte (+${Math.min(45,e.loc*12)} % de public) · `:''}Popularité de la carte : ${e.pop}. Les combats de titre, les rivalités et les boxeurs populaires remplissent la salle.</p></div>
    <div class="panel"><span class="lab">Estimation financière</span><div style="display:grid;gap:5px;margin-top:8px;font-size:14px">
      ${line('Billets',e.tickets)}${line('Commanditaires',e.spons)}${e.tv?line('Droits télé',e.tv):''}${e.ppvOn?(e.ppvOk?line(`PPV (${e.ppvBuys.toLocaleString('fr-CA')} achats à ${g.ppvp||60} $, ta part 50 %)`,e.ppvRev):'<div class="small" style="color:var(--warn)">PPV : combat principal pas assez populaire, pas d’achats.</div>'):''}
      ${line('Location',e.rent,1)}${e.promo?line('Promotion',e.promo,1):''}${line('Production',e.prod,1)}${e.pay?line('Bourses des adversaires',e.pay,1):''}${e.ppvCost?line('Production PPV',e.ppvCost,1):''}${e.fee?line('Frais de ville hôte ('+e.city.n+')',e.fee,1):''}${e.xc?line('Extras',e.xc,1):''}
      <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:6px"><b>Profit estimé</b><b class="num" style="color:${e.profit>=0?'var(--green)':'#ff7b8b'};font-size:18px">${e.profit>=0?'+':''}${$(e.profit)}</b></div></div>
      <p class="small" style="margin:6px 0 0">Le résultat réel varie de ±12 %.</p></div>
    <div class="panel"><span class="lab">Réglages</span><div style="margin-top:8px">${segH('gpr',PRICES.map(p=>[p,p+' $']),g.price)}</div><div style="margin-top:6px">${segH('gpm',PROMOB.map(p=>[p,p?$(p):'Aucune promo']),g.promo)}</div>
</div>${galaOpts(g,'gg')}
    <div class="panel"><div class="ph"><span class="lab">Carte · ${fs.length} combat${fs.length>1?'s':''}</span></div><div class="list">${fs.map(fightMini).join('')||'<p class="small" style="margin:0">Aucun combat. Ajoute au moins un combat, sinon le gala est annulé (50 % de la location perdue).</p>'}</div>
      ${g.week>=S.t+2?`<button class="btn pri big" style="margin-top:10px" data-a="galaadd" data-id="${g.id}">＋ Ajouter un combat</button>`:''}</div></div>`;
}

  return`<p class="lede">Fais travailler ton argent : chaque investissement rapporte chaque semaine ou rend ton club plus fort.</p><div class="list">

    <p class="small" style="margin:0 0 8px">Organise tes galas chez toi, sans location. Elle rapporte aussi chaque semaine (concerts, événements).${a?` Actuellement : ${ARENA_LV[a].cap.toLocaleString('fr-CA')} places, +${$(ARENA_LV[a].inc)}/sem.`:''}</p>

  <div class="panel"><span class="lab">🔎 Expéditions de recrutement</span><p class="small" style="margin:6px 0 8px">Envoie tes recruteurs dans un pays : les boxeurs trouvés arrivent chez les agents libres.</p>

function vRank(){
  if(!ui.div)ui.div=mine()[0]?.div||'welter';ui.rsub=ui.rsub||'belts';ui.rnat=ui.rnat||S.home;ui.rbody=ui.rbody||'WBC';
  const sub=`<div ${segG(6)} style="margin-bottom:10px">${[['belts','Ceintures'],['monde','Mondial'],['pays','Pays'],['goat','🐐 GOAT'],['promo','🏢 Promos'],['palm','Palmarès']].map(([k,n])=>`<button data-a="rsub" data-k="${k}" aria-pressed="${ui.rsub===k}">${n}</button>`).join('')}</div>`;
  if(ui.rsub==='promo'){const M=club(),me={me:1,n:S.club,nat:S.home,sc:prScore(null,M),cnt:M.length,bl:M.reduce((a,b)=>a+beltsOf(b).length,0)};
    const L=promoAlive().map(p=>{const B=prBoxers(p);return{p,sc:prScore(p,B),cnt:B.length,bl:B.reduce((a,b)=>a+beltsOf(b).length,0)}});L.push(me);L.sort((a,b)=>b.sc-a.sc);
    return sub+`<p class="small" style="margin:0 0 10px">Les promotions rivales et leurs écuries. Touche une promotion pour voir ses boxeurs. Si une promotion fait faillite, tu peux la racheter (maximum ${PRMAX} promotions : ton club + ${PRMAX-1}).</p>
    <div class="panel tw"><table><thead><tr><th>#</th><th>Promotion</th><th>Points</th></tr></thead><tbody>${L.map((x,i)=>x.me?`<tr class="me tap" data-a="openclub"><td class="rk">${i+1}</td><td><b>${flag(S.home)} ${esc(S.club)}</b> <span class="chip red">Ton club</span><div class="small">${x.cnt} boxeurs · ${x.bl} ceinture${x.bl>1?'s':''}</div></td><td class="num"><b>${x.sc}</b></td></tr>`
      :`<tr class="tap ${x.p.own?'me':''}" data-a="openpromo" data-id="${x.p.id}"><td class="rk">${i+1}</td><td><b><span class="bdot" style="--bc:${x.p.c}"></span>${flag(x.p.nat)} ${esc(x.p.n)}</b>${x.p.own?' <span class="chip gold">👑 À toi</span>':''}${x.p.sale?' <span class="chip bad">💥 Faillite · à vendre</span>':''}${x.p.fresh&&S.t-x.p.fresh<12?' <span class="chip">Nouvelle</span>':''}<div class="small">${x.p.own?'Toi':esc(prBoss(x.p).name)} · ${x.cnt} boxeurs · ${x.bl} ceinture${x.bl>1?'s':''}</div></td><td class="num"><b>${x.sc}</b></td></tr>`).join('')}</tbody></table></div>`}
  if(ui.rsub==='goat'){const G=goatBoard().slice(0,40);
    return sub+`<div class="panel tw"><table><thead><tr><th>#</th><th>Boxeur</th><th>GOAT</th></tr></thead><tbody>${G.map((x,i)=>{const b=x.b,h=x.h;return b?`<tr class="${b.mine?'me':''} tap" data-a="${b.mine?'open':'scout'}" data-id="${b.id}"><td class="rk">${i+1}</td><td><div class="opp"><div class="av sm ${tcls(b)}">${avatar(b,b.mine?'red':'blue')}</div><div><b>${flag(b.nat)} ${esc(b.name)}</b>${b.mine?' <span class="chip red">Ton club</span>':''}<div class="small">${divN(b.div)} · ${b.w}-${b.l}-${b.d} · ${crOf(b).tw} titre${crOf(b).tw>1?'s':''}${crOf(b).und?' · 👑 undisputed':''}</div>${b.champ?`<div style="margin-top:3px">${beltChips(b,26)}</div>`:''}</div></div></td><td class="num"><b>${x.g}</b><div class="small">${gTier(x.g)}</div></td></tr>`
      :`<tr><td class="rk">${i+1}</td><td><b>🏛️ ${flag(h.nat)} ${esc(h.nm)}</b><div class="small">Temple de la renommée · ${h.rec} · ${h.tw||0} titre${(h.tw||0)>1?'s':''}</div></td><td class="num"><b>${x.g}</b><div class="small">${gTier(x.g)}</div></td></tr>`}).join('')}</tbody></table></div><p class="small">Classement de tous les temps, toutes divisions. Touche un boxeur pour voir son mur des succès.</p>`}
  if(ui.rsub==='palm'){const H=S.champHist||[];
    return sub+`<div class="panel"><span class="lab">Changements de champions</span><ul class="log">${H.slice(0,80).map(h=>`<li>${h.belt?beltSvg(h.belt,34)+' ':''}<span class="chip ${h.mine?'red':''}">${divN(h.div)}</span> <b>${flag(h.nat)} ${esc(h.nm)}</b><br><span class="small">${esc(h.how)} · ${when(h.t)}</span></li>`).join('')||'<li class="small">Aucun changement pour l’instant.</li>'}</ul></div>`}
  const dseg=selH('div',DIVS.map(d=>[d.id,`${d.n} · ${d.kg}${mine().some(b=>b.div===d.id)?' · 🥊 '+mine().filter(b=>b.div===d.id).length:''}`]),ui.div);
  const row=(b,i,extra)=>`<tr class="${b.mine?'me':''} tap" data-a="${b.mine?'open':'scout'}" data-id="${b.id}"><td class="rk">${i}</td><td><div class="opp"><div class="av sm ${tcls(b)}">${avatar(b,b.mine?'red':'blue')}</div><div><b>${flag(b.nat)} ${esc(b.name)}</b>${b.mine?' <span class="chip red">Ton club</span>':''}<div class="small">${extra}</div></div></div></td><td class="num">${ovr(b)}</td><td class="small">${b.w}-${b.l}-${b.d}</td></tr>`;
  const tbl=rows=>`<div class="panel tw"><table><thead><tr><th>#</th><th>Boxeur</th><th>Note</th><th>Fiche</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  const champCard=(c,lab)=>c?`<button class="panel fm" data-a="${c.mine?'open':'scout'}" data-id="${c.id}" style="border-color:rgba(245,196,81,.5)"><div class="bx-h"><div class="av md ${tcls(c)}">${avatar(c,c.mine?'red':'blue')}</div><div class="bx-id"><span class="chip gold">${lab}</span><div class="nm" style="margin-top:6px">${flag(c.nat)} ${esc(c.name)}</div><div class="chips s" style="margin-top:4px">${beltChips(c)}</div><div class="sub">${rec(c)} · ${c.age} ans</div></div><div class="ovr"><b>${ovr(c)}</b><small>NOTE</small></div></div></button>`:'';
  if(ui.rsub==='belts'){const B=(S.belts||{})[ui.div]||{},h=getB(B[ui.rbody]),l=bodyList(ui.div,ui.rbody).slice(0,15),ul=champsOf(ui.div).find(isUndisp);
    return sub+dseg+`${ul?`<div class="al" style="margin-bottom:10px"><p>👑 <b>${esc(ul.name)}</b> est champion undisputed (WBC, WBA, WBO, IBF).</p></div>`:''}
      <div class="seg" style="margin-bottom:10px">${BELTS.map(k=>`<button data-a="rbody" data-k="${k}" aria-pressed="${ui.rbody===k}">${beltSvg(k,40)}</button>`).join('')}</div>
      <div class="stack">${champCard(h,'Champion '+ui.rbody+' · '+divN(ui.div))}${tbl(l.map((b,i)=>row(b,i+1,(b.champ?beltsOf(b).join(' · ')+' · ':'')+NAT[b.nat].n)).join(''))}</div><p class="small">Chaque fédération a son propre classement. Top 10 pour défier son champion. Les 4 grandes ceintures réunies font un champion undisputed.</p>`}
  if(ui.rsub==='pays'){
    const nats=Object.keys(NAT).filter(n=>S.boxers.some(b=>b.nat===n)).sort((a,b)=>(a===S.home?-1:b===S.home?1:NAT[a].n.localeCompare(NAT[b].n)));
    const nl=natList(ui.rnat,ui.div),c=nl.find(b=>b.nchamp),rest=nl.filter(b=>!b.nchamp);
    return sub+`${selH('rnat',nats.map(n=>[n,`${flag(n)} ${NAT[n].n}`]),ui.rnat)}${dseg}
      <div class="stack">${champCard(c,'Champion national · '+NAT[ui.rnat].n)}${rest.length?tbl(rest.map((b,i)=>row(b,i+1,'Mondial : '+rankLabel(b))).join('')):`<div class="panel small">Aucun boxeur de ce pays dans cette division.</div>`}</div>`;
  }
  const list=rankList(ui.div),top=list.slice(0,15),mu=list.slice(15).filter(b=>b.mine);
  return sub+dseg+`<div class="stack">${tbl(top.map((b,i)=>row(b,i+1,NAT[b.nat].n+' · '+b.age+' ans')).join('')+mu.map(b=>row(b,'–',NAT[b.nat].n)).join(''))}</div><p class="small">Classement mondial par points (hors champions).</p>`;
}

document.addEventListener('change',e=>{if(e.target.id==='pickb'){ui.bookFor=e.target.value;render()}});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='ng-club'){const v=e.target.value.trim()||'Coin Rouge',n=document.getElementById('ng-cn'),c=document.getElementById('ng-ci');if(n)n.textContent=v;if(c)c.textContent=initials(v)}if(id==='ng-mgr'){const m=document.getElementById('ng-cm');if(m)m.textContent=e.target.value.trim()||'toi'}if(id==='gn-name'&&ui.gn)ui.gn.name=e.target.value;if(id==='ng-club'&&ui.ng)ui.ng.club=e.target.value;else if(id==='ng-mgr'&&ui.ng)ui.ng.mgr=e.target.value;else if(id==='imp-code')ui.imp=e.target.value});
try{window.claude?.hot?.snapshot?.(()=>({S,menu:!!ui.menu}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

<script>
document.addEventListener('DOMContentLoaded',()=>{const C=window.Capacitor;if(!C||!C.isNativePlatform||!C.isNativePlatform())return;const P=C.Plugins||{};
  try{P.StatusBar&&(P.StatusBar.setStyle({style:'DARK'}),C.getPlatform()==='android'&&P.StatusBar.setOverlaysWebView({overlay:true}))}catch(e){}
  setTimeout(()=>{try{P.SplashScreen&&P.SplashScreen.hide()}catch(e){}},300);
  P.App&&P.App.addListener('backButton',()=>{const vis=id=>{const e=document.getElementById(id);return e&&!e.hidden};
    const close=document.querySelector('#ev:not([hidden]) [data-a=noticeok],#sheet:not([hidden]) [data-a=close]');if(!close&&(vis('neg')||vis('ev')))return;
    if(close){close.click();return}if(vis('fx'))return;if(vis('menu')){P.App.minimizeApp();return}if(typeof openMenu==='function')openMenu('home')});
});
</script>
<script>if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
